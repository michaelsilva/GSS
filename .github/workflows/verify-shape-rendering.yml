name: Verify geometricPrecision draft

on:
  push:
    branches:
      - ci/verify-shape-rendering-geometric-precision

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npx vitest run src/compiler/features/shape-rendering.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run src/test/backend-gpu.test.ts -t 'shape-rendering: geometricPrecision'
